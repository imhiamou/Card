apply plugin: 'com.android.application'

// Debug builds stay at versionCode 1 / versionName 1.0.
// The release workflow passes -PgamewebVersionName and -PgamewebVersionCode
// from the git tag and signs with ANDROID_KEYSTORE_* environment variables.
def gamewebVersionCodeValue = (findProperty("gamewebVersionCode") ?: "1").toString().toInteger()
def gamewebVersionNameValue = (findProperty("gamewebVersionName") ?: "1.0").toString()
def gamewebKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def gamewebKeystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def gamewebKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def gamewebKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def gamewebReleaseSigning = gamewebKeystorePath && gamewebKeystorePassword && gamewebKeyAlias && gamewebKeyPassword

android {
    namespace = "com.imhiamou.gameweb"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.imhiamou.gameweb"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode gamewebVersionCodeValue
        versionName gamewebVersionNameValue
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (gamewebReleaseSigning) {
                storeFile file(gamewebKeystorePath)
                storePassword gamewebKeystorePassword
                keyAlias gamewebKeyAlias
                keyPassword gamewebKeyPassword
                v2SigningEnabled true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (gamewebReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Assign the release signing config again after the android block.
// AGP can otherwise leave the release variant unsigned even when the
// signing config above was filled in.
if (gamewebReleaseSigning) {
    android.buildTypes.release.signingConfig = android.signingConfigs.release
}

afterEvaluate {
    tasks.matching { it.name == "assembleRelease" || it.name == "packageRelease" }.configureEach {
        doFirst {
            def config = android.buildTypes.release.signingConfig
            if (config == null || config.storeFile == null || !config.storeFile.isFile()) {
                throw new GradleException("The release build variant has no signing config. Refusing to build an unsigned APK.")
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
