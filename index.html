<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hidden Duel</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="wordchain.css">
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
</head>
<body>

<!-- Lobby screen: name → game → lobby code (character is chosen later for Hidden Hunt) -->
<div class="box" id="lobbyScreen">
<h1>Hidden Duel</h1>

<h3>Name</h3>
<input id="playerName" placeholder="Enter your name (2-16 characters)" maxlength="16" autocomplete="nickname">

<h3>Game</h3>
<select id="gameSelect">
<option value="hidden-hunt" selected>Hidden Hunt</option>
<option value="word-chain">Word Chain</option>
</select>

<!-- The lobby creator chooses their own code (4-8 letters/numbers) -->
<input id="createCode" placeholder="Choose Lobby Code (4-8 letters/numbers)" maxlength="8">

<button id="createBtn">Create Lobby</button>

<hr>

<input id="roomCode" placeholder="Lobby Code" maxlength="8">

<button id="joinBtn">Join Lobby</button>

<h2 id="status"></h2>
<h3 id="code"></h3>

</div>

<!-- Hidden Hunt placement: hide first, then pick character -->
<div class="box wide hidden" id="placementScreen">
<h2 id="placementTitle">Choose your hiding location.</h2>
<div id="board" class="board"></div>

<h3>Choose your character</h3>
<div class="charSelect grid4" id="placementCharSelect">
<div class="charOption" data-character="Knight"><span class="charEmoji">&#x1F6E1;&#xFE0F;</span> Knight</div>
<div class="charOption" data-character="Mage"><span class="charEmoji">&#x1F9D9;</span> Mage</div>
<div class="charOption" data-character="Hunter"><span class="charEmoji">&#x1F3F9;</span> Hunter</div>
<div class="charOption" data-character="Rogue"><span class="charEmoji">&#x1F5E1;&#xFE0F;</span> Rogue</div>
</div>

<button id="confirmBtn" disabled>Confirm</button>
<h3 id="placementStatus"></h3>
</div>

<!-- Gameplay screen (shown once both players have confirmed).
     Turn flow is entirely card-driven: draw, play ONE card, the card
     resolves and the turn passes automatically. No End Turn button.
     Layout: the game itself sits on the LEFT, all game text (messages
     and the log) on the RIGHT. -->
<div class="box gamebox hidden" id="gameScreen">
<div class="gameColumns">

<div class="gameLeft">

<!-- Player information panel: both characters are always visible -->
<div class="playerPanel">
<div class="playerInfo" id="myInfo"></div>
<div class="vs">VS</div>
<div class="playerInfo" id="oppInfo"></div>
</div>

<h2 id="turnIndicator"></h2>

<div id="gameBoard" class="board"></div>

<!-- Character ability + hand of cards -->
<div class="actionRow">
<div id="abilityCard" class="ability hidden"></div>
<div id="hand" class="hand"></div>
</div>

<p id="pileInfo"></p>

<!-- End-game reveal: both hiding spots + both deduction maps -->
<div id="endgameReveal" class="endgameReveal hidden">
<h3>End Game Reveal</h3>
<p id="endgameSummary"></p>
<div class="endgameMaps">
<div class="endgameMapCard">
<h4>Your deduction map</h4>
<div id="endgameMyMap" class="board endgameBoard"></div>
</div>
<div class="endgameMapCard">
<h4>Opponent's deduction map</h4>
<p id="endgameOppMapStatus" class="endgameWait">Waiting for opponent's map...</p>
<div id="endgameOppMap" class="board endgameBoard"></div>
</div>
</div>
</div>

<!-- Rematch: shown after game over; resets when both players accept -->
<button id="playAgainBtn" class="hidden">Play Again</button>

</div>

<div class="gameRight">
<p id="gameMsg"></p>
<!-- Public game log: never contains hidden positions -->
<div id="gameLog" class="log"></div>
</div>

</div>
</div>

<!-- Word Chain screen (mounted by wordchain.js; unused for Hidden Hunt) -->
<div class="box hidden" id="wordChainScreen"></div>

<script src="wordchain.js"></script>
<script src="index.js"></script>
</body>
</html>
