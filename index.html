<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hidden Duel</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
</head>
<body>

<!-- Lobby screen (existing) -->
<div class="box" id="lobbyScreen">
<h1>Hidden Duel</h1>

<input id="playerName" placeholder="Player Name">

<h3>Character</h3>
<select id="character">
<option>Knight</option>
<option>Mage</option>
<option>Hunter</option>
<option>Rogue</option>
</select>

<button id="createBtn">Create Lobby</button>

<hr>

<input id="roomCode" placeholder="Lobby Code">

<button id="joinBtn">Join Lobby</button>

<h2 id="status"></h2>
<h3 id="code"></h3>

</div>

<!-- Character placement screen (shown after both players join) -->
<div class="box hidden" id="placementScreen">
<h2 id="placementTitle">Choose your hiding location.</h2>
<div id="board" class="board"></div>
<button id="confirmBtn" disabled>Confirm Position</button>
<h3 id="placementStatus"></h3>
</div>

<!-- Gameplay screen (shown once both players have confirmed).
     Turn flow is entirely card-driven: draw, play ONE card, the card
     resolves and the turn passes automatically. No End Turn button. -->
<div class="box wide hidden" id="gameScreen">

<div class="portraits">
<div class="portrait" id="myPortrait"></div>
<h2 id="turnIndicator"></h2>
<div class="portrait" id="oppPortrait"></div>
</div>

<div id="gameBoard" class="board"></div>

<p id="gameMsg"></p>

<div id="hand" class="hand"></div>

<p id="pileInfo"></p>

</div>

<script src="index.js"></script>
</body>
</html>
