name: Dominoes AI tests

on:
  pull_request:
    branches: [main]
    paths:
      - "server/domino.js"
      - "server/bots/domino/**"
      - "package.json"
      - ".github/workflows/domino-ai-tests.yml"
  push:
    branches: [ai/domino-persistent-strategy]
    paths:
      - "server/domino.js"
      - "server/bots/domino/**"
      - "package.json"
      - ".github/workflows/domino-ai-tests.yml"

jobs:
  domino-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Dominoes AI strategy tests
        run: npm run test:domino-ai
