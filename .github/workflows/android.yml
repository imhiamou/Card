name: Build Gameweb Android debug APK

# Debug packaging only. This does not sign a release, publish to the
# Play Store, or touch the Windows installer.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/**"
      - "index.html"
      - "index.js"
      - "style.css"
      - "game-sfx.js"
      - "hidden-hunter.js"
      - "hidden-hunter.css"
      - "hidden-hunter-editor.js"
      - "hidden-hunter-editor.css"
      - "domino.js"
      - "domino.css"
      - "domino.html"
      - "uno.js"
      - "uno.css"
      - "uno.html"
      - "assets/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy the frontend and sync Capacitor
        run: npm ci --prefix mobile && npm --prefix mobile run sync

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Gameweb-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
