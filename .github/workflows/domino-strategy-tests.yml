name: Dominoes strategic AI tests

on:
  pull_request:
    branches: [main]
    paths:
      - "server/dominoStrategy.test.js"
      - "server/dominoInspect.test.js"
      - "server/dominoBehavior.test.js"
      - "server/dominoBehaviorBenchmark.test.js"
      - "server/bots/domino/**"
      - "server/domino.js"
      - "assets/domino-inspect.js"
      - "domino.js"
      - "package.json"
      - ".github/workflows/domino-strategy-tests.yml"
  push:
    branches: [main]
    paths:
      - "server/dominoStrategy.test.js"
      - "server/dominoInspect.test.js"
      - "server/dominoBehavior.test.js"
      - "server/dominoBehaviorBenchmark.test.js"
      - "server/bots/domino/**"
      - "server/domino.js"
      - "package.json"
      - ".github/workflows/domino-strategy-tests.yml"

jobs:
  domino-strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Dominoes strategy and prediction tests
        run: npm run test:domino-strategy
