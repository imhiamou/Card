name: Publish Hidden Hunter Windows release

# Production updates come only from a published GitHub Release whose tag
# matches desktop/package.json (v1.0.2 for version 1.0.2).
# Drafts and pre-releases do not publish installers.
# workflow_dispatch builds the selected commit and attaches the installer
# to the already-published release for that same version. Use it to repair
# v1.0.2 after this workflow is on main. It does not delete that release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag that should receive the installer, for example v1.0.2"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-windows:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.release.draft == false && github.event.release.prerelease == false) }}
    runs-on: windows-latest
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Test desktop update flow
        working-directory: desktop
        run: npm test

      - name: Require the release tag to match the desktop version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.release.tag_name }}
        run: node desktop/release-tag.js

      - name: Build and publish Windows installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: true
        run: npm run dist:publish

      - name: Check local update metadata
        shell: bash
        run: node desktop/verify-dist.js

      - name: Confirm the GitHub Release has the installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.release.tag_name }}
        run: node desktop/verify-release-assets.js
