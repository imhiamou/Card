name: Publish Hidden Hunter Windows release

# The GitHub Release tag is the application version.
# v1.0.4 becomes desktop version 1.0.4 inside this job only.
# The committed desktop/package.json does not have to match beforehand.
# This job does not create a commit or another Git tag.
# Drafts and pre-releases do not publish installers.
# workflow_dispatch uses the same tag, for example v1.0.4.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v1.0.4"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-windows:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.release.draft == false && github.event.release.prerelease == false) }}
    runs-on: windows-latest
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Set the desktop version from the release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.release.tag_name }}
        run: node desktop/release-tag.js

      - name: Test desktop update flow
        working-directory: desktop
        run: npm test

      - name: Build and publish Windows installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: true
        run: npm run dist:publish

      - name: Check local update metadata
        shell: bash
        run: node desktop/verify-dist.js

      - name: Confirm the GitHub Release has the installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.release.tag_name }}
        run: node desktop/verify-release-assets.js
